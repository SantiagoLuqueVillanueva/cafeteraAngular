<button (click)="cambiarConexion()">{{ this.estadoConexion ? 'Desconectar' : 'Conectar' }}</button>
<span>{{ this.estadoConexion ? 'Conectada' : 'Desconectada' }}</span>
<span>{{ estadoCafetera ? 'CafeteraOn' : 'CafeteraOff' }}</span>
@for (cafe of cafes; track $index) {
  <span>{{ cafe }}</span>
} @empty {
  <p>No se han pedido cafes aún</p>
}
<app-cocina
[estadoConexionComponent]="estadoConexion"
(estadoCafeteraOutput)="mostrarEstadoCafetera($event)"
(cafeSoloOutput)="anadirCafeSolo($event)"
(cafeConLecheOutput)="anadirCafeConLeche($event)">
</app-cocina>
